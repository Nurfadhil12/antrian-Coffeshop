# deployment/nginx/nginx.conf — konfigurasi utama
# File ini di-mount read-only ke /etc/nginx/nginx.conf di container nginx.
# Server block (virtual host) ada di nginx/templates/app.conf.template.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens   off;
    server_names_hash_bucket_size 64;

    # Batas default; per-server bisa override lewat ${NGINX_CLIENT_MAX_BODY_SIZE}
    client_max_body_size 25m;
    client_body_timeout  60s;
    client_header_timeout 60s;

    # ── Kompresi ──
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_disable      "msie6";
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/x-javascript
        application/xml application/xml+rss application/atom+xml
        image/svg+xml font/woff font/woff2;

    # ── Rate limit ──
    # Diperkuat lagi di level aplikasi kalau perlu (mis. @nestjs/throttler).
    limit_req_zone  $binary_remote_addr  zone=api_limit:10m  rate=20r/s;
    limit_req_zone  $binary_remote_addr  zone=web_limit:10m  rate=50r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr  zone=conn_limit:10m;

    # ── Proxy default ──
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_connect_timeout 10s;

    # Kalau di depan VPS ada Cloudflare / load balancer, aktifkan blok ini supaya
    # $remote_addr = IP asli client. JANGAN aktifkan tanpa proxy tepercaya: klien
    # bisa memalsukan $remote_addr dan melewati rate limit.
    # set_real_ip_from  0.0.0.0/0;
    # real_ip_header    CF-Connecting-IP;
    # real_ip_recursive on;

    include /etc/nginx/conf.d/*.conf;
}
