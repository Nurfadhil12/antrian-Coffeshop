# deployment/nginx/snippets/security-headers.conf
#
# Di-include di blok server :443 DAN di setiap location yang mendefinisikan
# add_header-nya sendiri (/healthz, /_next/static/, file statis).
#
# Kenapa harus di-include ulang: di nginx, begitu sebuah location punya SATU
# add_header, seluruh add_header dari blok server di atasnya TIDAK diwarisi lagi.
# Tanpa include ini, respons /_next/static/*.js keluar tanpa header keamanan
# sama sekali — dan itu tidak terlihat kecuali diperiksa satu per satu.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "SAMEORIGIN" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
